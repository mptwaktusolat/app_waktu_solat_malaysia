name: waktusolatmalaysia
description: App waktu solat seluruh Malaysia

publish_to: "none"

version: 2.14.3+176

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  admonitions: ^1.1.0
  app_settings: ^7.0.0
  auto_start_flutter: ^1.4.0
  cached_network_image: ^3.0.0
  device_info_plus: ^13.1.0
  dynamic_color: ^1.6.2
  email_validator: ^3.0.0
  firebase_analytics: ^12.0.1
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  flutter_custom_tabs: ^2.1.0
  flutter_device_compass: ^2.2.0
  flutter_local_notifications: ^22.0.1
  flutter_markdown: ^0.7.1
  flutter_spinkit: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.0
  fluttertoast: ^9.0.0
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_storage: ^2.0.1
  google_mobile_ads: ^9.0.0
  home_widget: ^0.9.0
  hotspot: ^0.1.3
  http: ^1.1.0
  in_app_review: ^2.0.2
  intl: ^0.20.2
  introduction_screen: ^4.0.0
  open_file: ^4.0.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.1
  permission_handler: ^12.0.0+1
  provider: ^6.0.0
  quick_actions: ^1.0.0
  restart_app: ^1.0.3
  share_plus: ^13.1.0
  timezone: ^0.11.0
  url_launcher: ^6.0.3
  waktusolat_api_client:
    git:
      url: https://github.com/mptwaktusolat/waktusolat_api_client.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/3d/
    - assets/images/
    - assets/images/mosque_bgs/
    - assets/json/
    - assets/qibla/
    - fonts/Manrope/OFL.txt
    - fonts/Archivo/OFL.txt
    - fonts/Baloo_Tamma_2/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope/static/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope/static/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope/static/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope/static/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope/static/Manrope-ExtraBold.ttf
          weight: 800
    - family: Archivo
      fonts:
        - asset: fonts/Archivo/static/Archivo-Regular.ttf
          weight: 400
        - asset: fonts/Archivo/static/Archivo-Medium.ttf
          weight: 500
        - asset: fonts/Archivo/static/Archivo-SemiBold.ttf
          weight: 600
        - asset: fonts/Archivo/static/Archivo-Bold.ttf
          weight: 700
        - asset: fonts/Archivo/static/Archivo-ExtraBold.ttf
          weight: 800
        - asset: fonts/Archivo/static/Archivo-Black.ttf
          weight: 900
    - family: BalooTamma2
      fonts:
        - asset: fonts/Baloo_Tamma_2/static/BalooTamma2-Bold.ttf
          weight: 700
    # Adding custom icon guide: https://github.com/mptwaktusolat/app_waktu_solat_malaysia/wiki/Custom-Icons
    - family: MyMptIcons
      fonts:
        - asset: assets/fonts/MyMptIcons.ttf
